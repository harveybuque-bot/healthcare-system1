<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctors - Healthcare System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Healthcare System</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="patients.html">Patients</a>
        <a class="nav-link active" href="doctors.html">Doctors</a>
        <a class="nav-link" href="appointments.html">Appointments</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h2>Doctors</h2>
    <div id="message"></div>

    <form id="doctorForm" class="row g-2 mb-4">
      <input type="hidden" id="doctorId">
      <div class="col-md-4">
        <input type="text" id="name" class="form-control" placeholder="Full name" required>
      </div>
      <div class="col-md-3">
        <input type="text" id="specialization" class="form-control" placeholder="Specialization" required>
      </div>
      <div class="col-md-3">
        <select id="department" class="form-select" required>
          <option value="">Select department</option>
        </select>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100" id="saveBtn">Add</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-striped bg-white">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Department</th><th>Actions</th></tr>
        </thead>
        <tbody id="doctorTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = '/api/doctors';

    function showMessage(text, type) {
      const box = document.getElementById('message');
      box.innerHTML = `<div class="alert alert-${type}"></div>`;
      box.firstChild.textContent = text;
    }

    async function loadDepartments() {
      const res = await fetch('/api/departments');
      const departments = await res.json();
      const select = document.getElementById('department');
      departments.forEach(d => {
        const option = document.createElement('option');
        option.value = d.id;
        option.textContent = d.name;
        select.appendChild(option);
      });
    }

    async function loadDoctors() {
      const res = await fetch(API);
      const doctors = await res.json();
      const tbody = document.getElementById('doctorTable');
      tbody.innerHTML = '';
      doctors.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.id}</td><td></td><td></td><td></td>
          <td>
            <button class="btn btn-sm btn-warning me-1">Edit</button>
            <button class="btn btn-sm btn-danger">Delete</button>
          </td>`;
        tr.children[1].textContent = d.name;
        tr.children[2].textContent = d.specialization;
        tr.children[3].textContent = d.department;
        const [editBtn, deleteBtn] = tr.querySelectorAll('button');
        editBtn.onclick = () => editDoctor(d);
        deleteBtn.onclick = () => deleteDoctor(d.id);
        tbody.appendChild(tr);
      });
    }

    function editDoctor(d) {
      document.getElementById('doctorId').value = d.id;
      document.getElementById('name').value = d.name;
      document.getElementById('specialization').value = d.specialization;
      document.getElementById('department').value = d.department_id;
      document.getElementById('saveBtn').textContent = 'Update';
    }

    async function deleteDoctor(id) {
      if (!confirm('Delete this doctor?')) return;
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      const data = await res.json();
      showMessage(data.message || data.error, res.ok ? 'success' : 'danger');
      loadDoctors();
    }

    document.getElementById('doctorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('doctorId').value;
      const body = {
        name: document.getElementById('name').value.trim(),
        specialization: document.getElementById('specialization').value.trim(),
        department_id: document.getElementById('department').value
      };
      const res = await fetch(id ? `${API}/${id}` : API, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      showMessage(data.message || data.error, res.ok ? 'success' : 'danger');
      if (res.ok) {
        e.target.reset();
        document.getElementById('doctorId').value = '';
        document.getElementById('saveBtn').textContent = 'Add';
        loadDoctors();
      }
    });

    loadDepartments().then(loadDoctors);
  </script>
</body>
</html>
