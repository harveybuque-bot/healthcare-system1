<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments - Healthcare System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Healthcare System</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="patients.html">Patients</a>
        <a class="nav-link" href="doctors.html">Doctors</a>
        <a class="nav-link active" href="appointments.html">Appointments</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h2>Appointments</h2>
    <div id="message"></div>

    <!-- Booking Flow Guide -->
    <div class="card p-3 mb-4 border-0 shadow-sm" style="background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 18px;">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <span class="fw-semibold text-muted small text-uppercase">Clinic Workflow:</span>
          <span class="badge bg-warning text-dark px-3 py-2 rounded-pill">1. Pending</span>
          <span class="text-muted fw-bold">&#10140;</span>
          <span class="badge bg-success text-white px-3 py-2 rounded-pill">2. Confirmed (Accept)</span>
          <span class="text-muted fw-bold">&#10140;</span>
          <span class="badge bg-primary text-white px-3 py-2 rounded-pill">3. Completed (Visit Done)</span>
        </div>
        <div>
          <span class="badge bg-danger text-white px-2 py-1 rounded-pill">Cancelled</span>
          <span class="small text-muted">can be set from Pending or Confirmed</span>
        </div>
      </div>
    </div>

    <form id="appointmentForm" class="row g-2 mb-4">
      <input type="hidden" id="appointmentId">
      <div class="col-md-3">
        <div class="input-group">
          <select id="patient" class="form-select" required>
            <option value="">Select patient</option>
          </select>
          <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#quickAddPatientModal" title="Add new patient">+ Add</button>
        </div>
      </div>
      <div class="col-md-3">
        <select id="doctor" class="form-select" required>
          <option value="">Select doctor</option>
        </select>
      </div>
      <div class="col-md-2">
        <input type="date" id="date" class="form-control" required>
      </div>
      <div class="col-md-2">
        <input type="time" id="time" class="form-control" required>
      </div>
      <div class="col-md-2 d-none" id="statusBox">
        <select id="status" class="form-select"></select>
      </div>
      <div class="col-md-8">
        <input type="text" id="notes" class="form-control" placeholder="Notes (optional)">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100" id="saveBtn">Book</button>
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-secondary w-100" id="cancelBtn">Clear</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-striped bg-white">
        <thead>
          <tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Notes</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="appointmentTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Quick Add Patient Modal -->
  <div class="modal fade" id="quickAddPatientModal" tabindex="-1" aria-labelledby="quickAddPatientModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius: 20px; border: 1px solid rgba(167, 139, 250, 0.3);">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="quickAddPatientModalLabel" style="font-family: 'DM Serif Display', serif; color: var(--ink);">Add New Patient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="quickPatientForm">
            <div class="mb-3">
              <label for="quickName" class="form-label" style="font-weight: 500;">Full Name</label>
              <input type="text" class="form-control" id="quickName" placeholder="e.g. Juan dela Cruz" required>
            </div>
            <div class="mb-3">
              <label for="quickBirthdate" class="form-label" style="font-weight: 500;">Birthdate</label>
              <input type="date" class="form-control" id="quickBirthdate" required>
            </div>
            <div class="mb-3">
              <label for="quickContact" class="form-label" style="font-weight: 500;">Contact Number</label>
              <input type="text" class="form-control" id="quickContact" placeholder="e.g. 0917-123-4567">
            </div>
            <div class="d-flex justify-content-end gap-2 pt-2">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save & Select</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = '/api/appointments';

    // Allowed status transitions representing the clinic flow
    const VALID_TRANSITIONS = {
      'Pending': ['Confirmed', 'Cancelled'],
      'Confirmed': ['Completed', 'Cancelled'],
      'Completed': [],
      'Cancelled': ['Pending']
    };

    function showMessage(text, type) {
      const box = document.getElementById('message');
      box.innerHTML = `<div class="alert alert-${type} shadow-sm"></div>`;
      box.firstChild.textContent = text;
      setTimeout(() => {
        if (box.firstChild) box.innerHTML = '';
      }, 5000);
    }

    async function loadPatients(selectedId = null) {
      try {
        const res = await fetch('/api/patients');
        if (!res.ok) throw new Error('Status ' + res.status);
        const patients = await res.json();
        const select = document.getElementById('patient');
        select.innerHTML = '<option value="">Select patient</option>';
        if (patients.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.disabled = true;
          opt.textContent = '(No patients yet - click + Add)';
          select.appendChild(opt);
        } else {
          patients.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `${p.name} (ID: ${p.id})`;
            select.appendChild(opt);
          });
        }
        if (selectedId) {
          select.value = selectedId;
        }
        return patients;
      } catch (err) {
        showMessage('Could not load patients: ' + err.message, 'danger');
      }
    }

    async function loadDoctors() {
      try {
        const res = await fetch('/api/doctors');
        if (!res.ok) throw new Error('Status ' + res.status);
        const doctors = await res.json();
        const select = document.getElementById('doctor');
        select.innerHTML = '<option value="">Select doctor</option>';
        doctors.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = `${d.name} (${d.specialization})`;
          select.appendChild(opt);
        });
        return doctors;
      } catch (err) {
        showMessage('Could not load doctors: ' + err.message, 'danger');
      }
    }

    function updateStatusOptions(currentStatus) {
      const select = document.getElementById('status');
      select.innerHTML = '';
      const allowed = [currentStatus, ...(VALID_TRANSITIONS[currentStatus] || [])];
      allowed.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s === currentStatus ? `${s} (Current)` : `Change to: ${s}`;
        select.appendChild(opt);
      });
      select.value = currentStatus;
    }

    async function updateStatus(id, newStatus) {
      if (newStatus === 'Cancelled') {
        if (!confirm('Are you sure you want to cancel this appointment?')) return;
      }
      try {
        const res = await fetch(`${API}/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          showMessage(data.message || `Appointment marked as ${newStatus}`, 'success');
          loadAppointments();
        } else {
          showMessage(data.error || 'Failed to update status', 'danger');
        }
      } catch (err) {
        showMessage('Cannot reach the server. Is node server.js running?', 'danger');
      }
    }

    async function loadAppointments() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error('Status ' + res.status);
        const appointments = await res.json();
        const tbody = document.getElementById('appointmentTable');
        tbody.innerHTML = '';
        if (appointments.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No appointments booked yet.</td></tr>';
          return;
        }
        appointments.forEach(a => {
          const tr = document.createElement('tr');
          const currentStatus = a.status || 'Pending';
          let badgeClass = 'bg-warning text-dark';
          if (currentStatus === 'Confirmed') badgeClass = 'bg-success text-white';
          else if (currentStatus === 'Completed') badgeClass = 'bg-primary text-white';
          else if (currentStatus === 'Cancelled') badgeClass = 'bg-danger text-white';

          // Build workflow action buttons for quick clinic operations
          let flowButtonsHtml = '';
          if (currentStatus === 'Pending') {
            flowButtonsHtml = `
              <button class="btn btn-sm btn-success me-1 btn-confirm" type="button" title="Accept booking">&#10003; Confirm</button>
              <button class="btn btn-sm btn-outline-danger me-1 btn-cancel-appt" type="button" title="Cancel booking">&#10005; Cancel</button>
            `;
          } else if (currentStatus === 'Confirmed') {
            flowButtonsHtml = `
              <button class="btn btn-sm btn-primary me-1 btn-complete" type="button" title="Mark visit finished">&#9733; Complete</button>
              <button class="btn btn-sm btn-outline-danger me-1 btn-cancel-appt" type="button" title="Cancel appointment">&#10005; Cancel</button>
            `;
          } else if (currentStatus === 'Completed') {
            flowButtonsHtml = `<span class="badge bg-light text-muted border me-1">&#10003; Done</span>`;
          } else if (currentStatus === 'Cancelled') {
            flowButtonsHtml = `
              <button class="btn btn-sm btn-outline-warning me-1 btn-reopen" type="button" title="Reopen booking to Pending">&#8635; Reopen</button>
            `;
          }

          tr.innerHTML = `
            <td>${a.id}</td>
            <td></td>
            <td></td>
            <td>${a.date}</td>
            <td>${a.time}</td>
            <td><span class="badge ${badgeClass}">${currentStatus}</span></td>
            <td></td>
            <td class="text-nowrap text-end">
              ${flowButtonsHtml}
              <button class="btn btn-sm btn-outline-secondary me-1 btn-edit" type="button">Edit</button>
              <button class="btn btn-sm btn-danger btn-del" type="button">Delete</button>
            </td>
          `;
          tr.children[1].textContent = a.patient_name || `Patient #${a.patient_id}`;
          tr.children[2].textContent = a.doctor_name || `Doctor #${a.doctor_id}`;
          tr.children[6].textContent = a.notes || '-';

          // Attach handlers
          const confirmBtn = tr.querySelector('.btn-confirm');
          if (confirmBtn) confirmBtn.onclick = () => updateStatus(a.id, 'Confirmed');

          const completeBtn = tr.querySelector('.btn-complete');
          if (completeBtn) completeBtn.onclick = () => updateStatus(a.id, 'Completed');

          const cancelApptBtn = tr.querySelector('.btn-cancel-appt');
          if (cancelApptBtn) cancelApptBtn.onclick = () => updateStatus(a.id, 'Cancelled');

          const reopenBtn = tr.querySelector('.btn-reopen');
          if (reopenBtn) reopenBtn.onclick = () => updateStatus(a.id, 'Pending');

          const editBtn = tr.querySelector('.btn-edit');
          if (editBtn) editBtn.onclick = () => editAppointment(a);

          const delBtn = tr.querySelector('.btn-del');
          if (delBtn) delBtn.onclick = () => deleteAppointment(a.id);

          tbody.appendChild(tr);
        });
      } catch (err) {
        showMessage('Could not load appointments: ' + err.message, 'danger');
      }
    }

    function editAppointment(a) {
      document.getElementById('appointmentId').value = a.id;
      document.getElementById('patient').value = a.patient_id;
      document.getElementById('doctor').value = a.doctor_id;
      document.getElementById('date').value = a.date;
      document.getElementById('time').value = a.time;
      document.getElementById('notes').value = a.notes || '';
      updateStatusOptions(a.status || 'Pending');
      document.getElementById('statusBox').classList.remove('d-none');
      document.getElementById('saveBtn').textContent = 'Update';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('appointmentForm').reset();
      document.getElementById('appointmentId').value = '';
      document.getElementById('statusBox').classList.add('d-none');
      document.getElementById('saveBtn').textContent = 'Book';
    }

    document.getElementById('cancelBtn').onclick = resetForm;

    async function deleteAppointment(id) {
      if (!confirm('Are you sure you want to delete this appointment?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        const data = await res.json().catch(() => ({}));
        showMessage(data.message || data.error || (res.ok ? 'Deleted' : 'Delete failed'), res.ok ? 'success' : 'danger');
        loadAppointments();
      } catch (err) {
        showMessage('Cannot reach the server. Is node server.js running?', 'danger');
      }
    }

    document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('appointmentId').value;
      const patient_id = document.getElementById('patient').value;
      const doctor_id = document.getElementById('doctor').value;
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const notes = document.getElementById('notes').value.trim();

      if (!patient_id) {
        showMessage('Please select a patient', 'danger');
        return;
      }
      if (!doctor_id) {
        showMessage('Please select a doctor', 'danger');
        return;
      }

      const body = {
        patient_id: Number(patient_id),
        doctor_id: Number(doctor_id),
        date,
        time,
        notes: notes || null
      };

      if (id) {
        body.status = document.getElementById('status').value || 'Pending';
      }

      try {
        const res = await fetch(id ? `${API}/${id}` : API, {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          showMessage(data.message || (id ? 'Appointment updated' : 'Appointment booked successfully'), 'success');
          resetForm();
          loadAppointments();
        } else {
          showMessage(data.error || 'Server error ' + res.status, 'danger');
        }
      } catch (err) {
        showMessage('Cannot reach the server. Is node server.js running?', 'danger');
      }
    });

    // Quick add patient modal form submit handler
    document.getElementById('quickPatientForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('quickName').value.trim();
      const birthdate = document.getElementById('quickBirthdate').value;
      const contact = document.getElementById('quickContact').value.trim();

      try {
        const res = await fetch('/api/patients', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, birthdate, contact })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          showMessage(`Patient "${name}" created and selected!`, 'success');
          e.target.reset();
          const modalEl = document.getElementById('quickAddPatientModal');
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
          await loadPatients(data.id);
        } else {
          alert(data.error || 'Failed to add patient');
        }
      } catch (err) {
        alert('Cannot reach the server. Is node server.js running?');
      }
    });

    loadPatients();
    loadDoctors();
    loadAppointments();
  </script>
</body>
</html>
